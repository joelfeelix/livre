<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Livre">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Livre</title>
<style>
:root{
  --bg:#0f1419; --bg2:#161d24; --card:#1b242d; --card2:#222d38; --line:#2b3743;
  --tx:#e9eef2; --tx2:#9aa8b5; --tx3:#6b7a88;
  --acc:#4fd1a5; --acc2:#2fb389; --accbg:rgba(79,209,165,.12);
  --warn:#f2b45a; --bad:#ef6b6b; --badbg:rgba(239,107,107,.12);
  --blue:#6aa8ff;
  --r:18px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,.entry p,.mini-a{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:90px}
input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-width:0;min-height:48px;text-align:left}
input[type=datetime-local]::-webkit-date-and-time-value{text-align:left}
label{display:block;font-size:13px;color:var(--tx2);margin:14px 0 6px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.app{max-width:560px;margin:0 auto;padding:calc(14px + var(--safe-t)) 16px calc(96px + var(--safe-b))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top h1{font-size:26px}
.muted{color:var(--tx2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--tx3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:600;width:100%}
.btn.pri{background:var(--acc);color:#06221a;border-color:var(--acc)}
.btn.bad{background:var(--badbg);color:var(--bad);border-color:rgba(239,107,107,.3)}
.btn.ghost{background:none}
.btn:active{transform:scale(.98)}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
/* counter */
.hero{text-align:center;padding:22px 16px 18px}
.ring{position:relative;width:230px;height:230px;margin:4px auto 10px}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:56px;font-weight:800;line-height:1;letter-spacing:-.03em}
.unit{font-size:15px;color:var(--tx2);margin-top:4px}
.hms{display:flex;justify-content:center;gap:8px;margin-top:6px}
.hms div{background:var(--bg2);border-radius:12px;padding:8px 10px;min-width:62px}
.hms b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.hms span{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}
.next{margin-top:12px;font-size:14px;color:var(--tx2)}
.stat b{display:block;font-size:22px;font-weight:700}
.stat span{font-size:12px;color:var(--tx2)}
.badges{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.badges::-webkit-scrollbar{display:none}
.badge{flex:none;width:74px;text-align:center;padding:10px 4px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);opacity:.4}
.badge.got{opacity:1;border-color:var(--acc);background:var(--accbg)}
.badge .e{font-size:24px} .badge .t{font-size:11px;margin-top:4px;color:var(--tx2)}
.pledge{display:flex;align-items:center;gap:12px}
.pledge .ck{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:20px;flex:none}
.pledge.done .ck{background:var(--acc);border-color:var(--acc);color:#06221a}
.reason{padding:10px 12px;background:var(--bg2);border-radius:12px;margin-top:8px;display:flex;justify-content:space-between;gap:8px}
.sec-t{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin:18px 4px 8px;font-weight:700}
/* SOS */
.sos-hero{background:linear-gradient(160deg,#1d3b33,#16242b);border-color:#2a4a40;text-align:center;padding:22px}
.sos-hero h2{font-size:22px}
.tool{display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.tool .ti{width:48px;height:48px;border-radius:14px;background:var(--bg2);display:grid;place-items:center;font-size:24px;flex:none}
.tool h3{font-size:16px} .tool p{margin:2px 0 0;font-size:13px;color:var(--tx2)}
.crisis{border-color:rgba(242,180,90,.35);background:rgba(242,180,90,.08)}
.crisis a{color:var(--warn);font-weight:700}
/* techniques */
details.tech{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
details.tech summary{list-style:none;padding:16px;display:flex;gap:12px;align-items:center;cursor:pointer}
details.tech summary::-webkit-details-marker{display:none}
details.tech summary .e{font-size:24px}
details.tech summary h3{font-size:16px}
details.tech summary p{margin:2px 0 0;font-size:13px;color:var(--tx2)}
details.tech .body{padding:0 16px 16px;color:var(--tx2);font-size:15px}
details.tech .body ol,details.tech .body ul{padding-left:20px;margin:8px 0}
details.tech .body li{margin:6px 0}
details.tech[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
/* journal */
.moods{display:flex;justify-content:space-between;gap:6px}
.mood{flex:1;padding:10px 0;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:24px;text-align:center}
.mood.on{border-color:var(--acc);background:var(--accbg)}
.entry{border-left:3px solid var(--acc);padding:4px 0 4px 12px;margin:12px 0}
.entry.urge{border-color:var(--warn)} .entry.relapse{border-color:var(--bad)}
.entry .h{font-size:12px;color:var(--tx3)}
.entry p{margin:4px 0 0;white-space:pre-wrap;word-wrap:break-word}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:10px}
.bars div{flex:1;background:var(--warn);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.bars-x{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);margin-top:4px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(15,20,25,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--safe-b));z-index:20}
nav .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--tx3);padding:4px 0;min-width:0;white-space:nowrap}
nav button .e{font-size:22px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--acc)} nav button.on .e{filter:none;opacity:1}
nav button.sos .e{filter:none;opacity:1}
nav button.sos{color:var(--bad)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--bg2);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + var(--safe-b));border:1px solid var(--line);border-bottom:0;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:21px;margin-bottom:4px}
.emojis{display:flex;flex-wrap:wrap;gap:8px}
.emojis button{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:22px}
.emojis button.on{border-color:var(--acc);background:var(--accbg)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600}
.seg button.on{border-color:var(--acc);background:var(--accbg);color:var(--acc)}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--warn)}
/* breathing */
.breath{width:220px;height:220px;margin:20px auto;position:relative;display:grid;place-items:center}
.breath .c{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(79,209,165,.55),rgba(79,209,165,.08));transform:scale(.45);transition:transform 4s ease-in-out}
.breath .l{position:relative;font-size:22px;font-weight:700;text-align:center}
.breath .l small{display:block;font-size:40px;font-weight:800}
.timer{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:14px 0 4px}
.step-n{font-size:72px;font-weight:800;text-align:center;color:var(--acc);line-height:1;margin-top:10px}
.empty{text-align:center;padding:40px 20px}
.empty .e{font-size:56px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:var(--acc);color:#06221a;padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.quote{font-size:17px;font-style:italic;color:var(--tx);text-align:center;padding:4px 8px}
/* afirmações */
.affcard{position:relative;border-radius:26px;min-height:max(300px, calc(100vh - 340px - var(--safe-t) - var(--safe-b)));min-height:max(300px, calc(100dvh - 340px - var(--safe-t) - var(--safe-b)));display:flex;align-items:center;justify-content:center;padding:34px 26px 54px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;box-shadow:0 10px 40px rgba(0,0,0,.35);transition:background .5s;overflow:hidden}
.affcard::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.12),transparent 55%)}
.aff-t{position:relative;font-family:"New York","Iowan Old Style",Georgia,serif;font-size:31px;line-height:1.25;font-weight:600;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.25);letter-spacing:-.01em}
.aff-hint{position:absolute;bottom:16px;left:0;right:0;font-size:12px;color:rgba(255,255,255,.55)}
@keyframes affIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes affInDown{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
.aff-actions{display:flex;justify-content:space-around;margin:14px 0 4px}
.aff-actions button{width:54px;height:54px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:22px}
.aff-actions button:active{transform:scale(.92)}
.aff-mini{border:0;cursor:pointer;padding:18px}
.aff-mini-t{font-family:"New York","Iowan Old Style",Georgia,serif;font-size:21px;font-weight:600;color:#fff;margin:8px 0 10px;line-height:1.3}
.aff-ref{display:block;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.7);margin-top:14px;text-transform:uppercase}
.aff-mini-t .aff-ref{font-size:11px;margin-top:6px}
/* sonhos */
.dream-hero{background:linear-gradient(165deg,#3d3366,#141e30);border:0}
.saved-pill{margin-top:12px;background:rgba(79,209,165,.18);color:#bff3e0;border-radius:12px;padding:10px 12px;font-size:14px}
.people{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.person{flex:none;width:78px;text-align:center}
.person .av{width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--card2) center/cover;border:3px solid var(--acc);display:grid;place-items:center;font-size:26px;font-weight:700;color:var(--acc)}
.person .av.add{border:2px dashed var(--line);color:var(--tx2)}
.person .nm{font-size:12px;color:var(--tx2);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.dcard{border-radius:18px;overflow:hidden;padding:0;text-align:left;border:1px solid var(--line)}
.dcover{position:relative;aspect-ratio:4/5;background-size:cover;background-position:center}
.demo{position:absolute;top:18%;left:0;right:0;text-align:center;font-size:48px}
.dshade{position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.82));display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#fff}
.dtitle{font-weight:700;font-size:15px;line-height:1.25}
.dsub{font-size:11.5px;color:rgba(255,255,255,.75);margin-top:3px}
.dbadge{align-self:flex-start;background:var(--acc);color:#06221a;font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px;margin-bottom:auto}
.dbar{height:5px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:6px;overflow:hidden}
.dbar div{height:100%;background:var(--acc);border-radius:3px}
.dbar.big{height:9px;margin:10px 0 6px;background:var(--bg2)}
.dview-img{height:240px;border-radius:18px;background:center/cover;margin-bottom:14px}
.whycard{position:relative;height:190px;border-radius:var(--r);overflow:hidden;background-size:cover;background-position:center;margin-bottom:12px;cursor:pointer}
.ph-pick{display:grid;place-items:center;height:170px;border-radius:16px;border:2px dashed var(--line);background:var(--card) center/cover;color:var(--tx2);text-align:center;font-size:13px;margin:12px 0 0;cursor:pointer}
.ph-pick span{font-size:13px;line-height:1.6}
.ph-pick.has{border-style:solid;border-color:var(--acc)}
.ph-pick.has span{background:rgba(0,0,0,.55);color:#fff;padding:6px 10px;border-radius:10px}
.ph-pick.round{width:130px;height:130px;border-radius:50%;margin:12px auto 0}
.step{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:6px;cursor:pointer}
.step .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.step span:nth-child(2){flex:1}
.step.done .ck{background:var(--acc);border-color:var(--acc);color:#06221a}
.step.done span:nth-child(2){text-decoration:line-through;color:var(--tx3)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.photos div{aspect-ratio:1;border-radius:14px;background:center/cover;position:relative;overflow:hidden}
.photos div span{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7))}
/* coach IA */
#chat{position:fixed;inset:0;z-index:45;background:var(--bg);display:none;flex-direction:column;-webkit-user-select:text;user-select:text}
#chat.show{display:flex}
.chat-h{display:flex;align-items:center;gap:12px;padding:calc(10px + var(--safe-t)) 16px 10px;border-bottom:1px solid var(--line);max-width:560px;width:100%;margin:0 auto}
.chat-h .icon-btn{font-size:22px;flex:none}
.msgs{flex:1;overflow-y:auto;padding:16px;max-width:560px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;margin:6px 0;line-height:1.45;font-size:15.5px;word-wrap:break-word}
.msg.user{margin-left:auto;background:var(--acc);color:#06221a;border-bottom-right-radius:6px}
.msg.ai{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.ai ul{margin:6px 0;padding-left:18px}.msg.ai li{margin:3px 0}
.msg.err{background:var(--badbg);color:var(--bad);border-color:rgba(239,107,107,.3)}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tx3);margin:0 2px;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.qchips{padding:0 16px;margin:0 auto 6px;max-width:560px;width:100%}
.chat-in{display:flex;gap:8px;align-items:flex-end;padding:8px 16px calc(10px + var(--safe-b));border-top:1px solid var(--line);max-width:560px;width:100%;margin:0 auto}
.chat-in textarea{min-height:44px;max-height:120px;border-radius:22px;padding:11px 16px;resize:none}
.chat-in .send{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#06221a;font-size:18px;flex:none}
.chat-in .send:disabled{opacity:.4}
.ai-card{background:linear-gradient(160deg,#1d3550,#141e2b);border-color:#2a4560;cursor:pointer}
.ai-note{font-size:12px;color:var(--tx3);text-align:center;margin:10px 0 4px}
/* mini diário */
.mini-q{font-weight:700;margin:4px 0 10px}
.mini-a{background:var(--bg2);border-radius:12px;padding:10px 12px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav><div class="in" id="nav"></div></nav>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div id="chat">
  <div class="chat-h">
    <button class="icon-btn" onclick="closeChat()" title="Voltar">‹</button>
    <div style="flex:1"><b>🤖 Coach Livre</b><div class="tiny">IA no seu iPhone · conversas privadas</div></div>
    <button class="icon-btn" onclick="clearChat()" title="Nova conversa">🗑</button>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="qchips chips" id="qchips"></div>
  <div class="chat-in">
    <textarea id="chatIn" rows="1" placeholder="Escreva para o seu coach..." oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea>
    <button class="send" id="chatSend" onclick="sendChat()">➤</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================== Dados ================== */
const KEY = 'livre.v1';
const DAY = 864e5, HOUR = 36e5, MIN = 6e4;
const EMOJIS = ['🚬','🍺','🍷','📱','🎮','🎰','🍔','🍬','☕','💊','🌿','🔞','🛒','📺','💻','🥤','😤','⏰'];
const TEMPLATES = [
  {name:'Cigarro', emoji:'🚬'},{name:'Álcool', emoji:'🍺'},{name:'Pornografia', emoji:'🔞'},
  {name:'Redes sociais', emoji:'📱'},{name:'Jogos', emoji:'🎮'},{name:'Apostas', emoji:'🎰'},
  {name:'Açúcar', emoji:'🍬'},{name:'Maconha', emoji:'🌿'},{name:'Compras', emoji:'🛒'},
];
const MILESTONES = [
  {ms:DAY, t:'1 dia', e:'🌱'},{ms:3*DAY, t:'3 dias', e:'🌿'},{ms:7*DAY, t:'1 semana', e:'⭐'},
  {ms:14*DAY, t:'2 semanas', e:'🔥'},{ms:30*DAY, t:'1 mês', e:'🏅'},{ms:60*DAY, t:'2 meses', e:'💪'},
  {ms:90*DAY, t:'3 meses', e:'🏆'},{ms:180*DAY, t:'6 meses', e:'💎'},{ms:365*DAY, t:'1 ano', e:'👑'},
  {ms:730*DAY, t:'2 anos', e:'🚀'},{ms:1825*DAY, t:'5 anos', e:'🌟'},
];
const TRIGGERS = ['Estresse','Tédio','Solidão','Ansiedade','Tristeza','Cansaço','Fome','Raiva','Festa / social','Hábito / horário','Viu algo que lembrou','Outro'];

function load(){
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.habits) return d; } catch(e){}
  // No app iOS, há uma cópia de segurança salva pelo próprio app
  try { const d = window.__LIVRE_NATIVE; if (d && d.habits) return d; } catch(e){}
  return {habits:[], urges:[], journal:[], pledges:{}, activeId:null};
}
const NATIVE = window.webkit && window.webkit.messageHandlers;
let S = load();
function ensureAff(){
  S.aff = Object.assign({cats: AFF_CATS.map(c=>c.k), favs: [], custom: [], mode: 'all', reminders: {count: 0, start: 8, end: 21}, read: {}, v: 2}, S.aff || {});
  // quem já usava antes ganha as categorias novas ligadas
  if ((S.aff.v||1) < 2){ AFF_CATS.forEach(c => { if (!S.aff.cats.includes(c.k)) S.aff.cats.push(c.k); }); S.aff.v = 2; }
  S.dreams = S.dreams || []; S.people = S.people || [];
}
ensureAff();
function save(){
  const json = JSON.stringify(S);
  try { localStorage.setItem(KEY, json); } catch(e){ if (!NATIVE) toast('Não foi possível salvar'); }
  try { NATIVE && NATIVE.store && NATIVE.store.postMessage(json); } catch(e){}
  try { syncWidget(); } catch(e){}
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const active = () => S.habits.find(h => h.id === S.activeId) || S.habits[0];
const todayKey = (d=new Date()) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmtDate = ms => new Date(ms).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
const fmtDT = ms => new Date(ms).toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const money = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits: v>=100?0:2});
function dur(ms){
  const d = Math.floor(ms/DAY);
  if (d >= 365) { const y = Math.floor(d/365), r = d%365; return y+(y>1?' anos':' ano')+(r?` e ${r} d`:''); }
  if (d >= 1) return d + (d>1?' dias':' dia');
  const h = Math.floor(ms/HOUR); if (h>=1) return h+' h';
  return Math.max(0,Math.floor(ms/MIN))+' min';
}
function toLocalInput(ms){ const d=new Date(ms); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function streak(h){ return Math.max(0, Date.now() - h.start); }
function best(h){ return Math.max(h.best||0, streak(h)); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),2200); }
function vibrate(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

function tick(){
  if (tab!=='home' || !S.habits.length) return;
  const h = active(), ms = streak(h);
  const d = Math.floor(ms/DAY), hh = Math.floor(ms%DAY/HOUR), mm = Math.floor(ms%HOUR/MIN), ss = Math.floor(ms%MIN/1000);
  const set = (id,v) => { const el=document.getElementById(id); if(el) el.textContent=v; };
  set('cDays', d); set('cUnit', d===1?'dia':'dias');
  set('cH', String(hh).padStart(2,'0')); set('cM', String(mm).padStart(2,'0')); set('cS', String(ss).padStart(2,'0'));
  const next = MILESTONES.find(m=>m.ms>ms);
  const prev = [...MILESTONES].reverse().find(m=>m.ms<=ms);
  const from = prev?prev.ms:0, to = next?next.ms:from||1;
  const pct = next ? (ms-from)/(to-from) : 1;
  const rp = document.getElementById('ringp'); if (rp) rp.style.strokeDashoffset = 641*(1-pct);
  set('cNext', next ? `Próxima conquista: ${next.e} ${next.t} — faltam ${dur(next.ms-ms)}` : 'Você conquistou todos os marcos. Lenda! 🌟');
  const days = ms/DAY;
  set('cMoney', h.costPerDay ? money(days*h.costPerDay) : 'defina ✏️');
  set('cTime', h.hoursPerDay ? dur(days*h.hoursPerDay*HOUR) : 'defina ✏️');
}

const ALL_AFFS = () => Object.entries(AFFS).flatMap(([k,l]) => l.map(t => t));
const hash = s => { let h=0; for (const c of s) h = (h*31 + c.charCodeAt(0))|0; return Math.abs(h); };
function dailyAff(d = new Date()){ const all = ALL_AFFS(); return all[(d.getFullYear()*372 + d.getMonth()*31 + d.getDate()) % all.length]; }
function dailyAffCard(){
  const t = dailyAff();
  return `<div class="card aff-mini" style="background:${AFF_BG[hash(t)%AFF_BG.length]}" onclick="openAff(${JSON.stringify(t).replace(/"/g,'&quot;')})">
    <div class="tiny" style="color:rgba(255,255,255,.65)">✨ AFIRMAÇÃO DO DIA</div>
    <div class="aff-mini-t">${affHTML(t).replace(/font-size:\d+px/, 'font-size:inherit')}</div>
    <div class="tiny" style="color:rgba(255,255,255,.55)">Toque para ver mais</div></div>`;
}
// Versículos vêm no formato "texto — Referência"
function affHTML(t){
  const i = t.lastIndexOf(' — ');
  const body = i > 0 ? t.slice(0, i) : t, ref = i > 0 ? t.slice(i + 3) : '';
  const size = body.length > 140 ? 22 : body.length > 90 ? 26 : 31;
  return `<span style="font-size:${size}px">${esc(body)}</span>${ref ? `<span class="aff-ref">${esc(ref)}</span>` : ''}`;
}
function affPool(){
  const a = S.aff;
  if (a.mode==='biblia') return [...AFFS.biblia];
  if (a.mode==='favs') return [...a.favs];
  if (a.mode==='mine') return [...a.custom];

/* ================== Fotos (IndexedDB + cópia no iPhone) ================== */
const PH = {};   // id -> dataURL
function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('livre-fotos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('f');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function phPut(id, data){
  PH[id] = data;
  try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('f','readwrite'); t.objectStore('f').put(data, id); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch(e){}
  try { NATIVE && NATIVE.photo && NATIVE.photo.postMessage({id, data}); } catch(e){}
}
async function phDel(id){
  if (!id) return; delete PH[id];
  try { const db = await idb(); db.transaction('f','readwrite').objectStore('f').delete(id); } catch(e){}
  try { NATIVE && NATIVE.photo && NATIVE.photo.postMessage({id, data: null}); } catch(e){}
}
async function phLoadAll(){
  try {
    const db = await idb();
    await new Promise(res => {
      const rq = db.transaction('f').objectStore('f').openCursor();
      rq.onsuccess = () => { const c = rq.result; if (c){ PH[c.key] = c.value; c.continue(); } else res(); };
      rq.onerror = () => res();
    });
  } catch(e){}
  // No iPhone, recupera fotos guardadas pelo app se o navegador interno tiver perdido alguma
  const nat = window.__LIVRE_PHOTOS || {};
  for (const id in nat) if (!PH[id]) await phPut(id, nat[id]);
}
function resizeImage(file, max = 1100){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

  inp.value = '';

// Resumo compacto dos dados da pessoa para a IA (fica só no iPhone)
function aiContext(){
  const L = [], now = Date.now(), cut = (s, n) => String(s||'').replace(/\s+/g,' ').slice(0, n);
  S.habits.forEach(h => L.push(`- Hábito que quer deixar: ${h.name}. Está livre há ${dur(streak(h))}; maior sequência ${dur(best(h))}; voltou ao hábito ${(h.relapses||[]).length} vez(es)${h.costPerDay?`; gastava ${money(h.costPerDay)} por dia`:''}.`));
  if (!S.habits.length) L.push('- Ainda não cadastrou nenhum hábito.');
  const urges = S.urges.filter(u => now - u.at < 45*DAY);
  if (urges.length){
    const by = {}, per = {madrugada:0, manhã:0, tarde:0, noite:0};
    urges.forEach(u => { if (u.trigger && u.trigger!=='—') by[u.trigger]=(by[u.trigger]||0)+1; const hr=new Date(u.at).getHours(); per[hr<6?'madrugada':hr<12?'manhã':hr<18?'tarde':'noite']++; });
    const top = Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>`${k} (${v}x)`).join(', ');
    L.push(`- Momentos de vontade nos últimos 45 dias: ${urges.length}, superou ${urges.filter(u=>u.resisted).length}. Gatilhos: ${top||'não informados'}. Por período: ${Object.entries(per).map(([k,v])=>`${k} ${v}`).join(', ')}.`);
    const notes = urges.filter(u=>u.note).slice(-3).map(u=>cut(u.note,90));
    if (notes.length) L.push(`- Anotações desses momentos: ${notes.join(' | ')}`);
  } else {
    L.push('- Ainda não registrou nenhum momento de vontade no app, então não há dados de gatilhos nem de horários.');
  }
  const rel = S.habits.flatMap(h => (h.relapses||[]).map(r => ({...r, h:h.name}))).sort((a,b)=>b.at-a.at).slice(0,3);
  if (rel.length) L.push(`- Tropeços recentes: ${rel.map(r=>`${r.h} em ${fmtDate(r.at)}${r.note?` (${cut(r.note,80)})`:''}`).join('; ')}.`);
  const reasons = S.habits.flatMap(h => h.reasons||[]).slice(0,5);
  if (reasons.length) L.push(`- Motivos para parar: ${reasons.map(r=>cut(r,70)).join('; ')}.`);
  if (S.dreams.length) L.push(`- Sonhos: ${S.dreams.slice(0,6).map(d=>`${cut(d.title,50)}${d.achieved?' (realizado)':''}${d.why?` — ${cut(d.why,60)}`:''}`).join('; ')}.`);
  if (S.people.length) L.push(`- Vence por estas pessoas: ${S.people.slice(0,6).map(p=>cut(p.name,30)).join(', ')}.`);
  const j = S.journal.slice(-4).map(x => `${x.mood!=null?MOODS[x.mood][1]+': ':''}${cut(x.text,110)}`);
  if (j.length) L.push(`- Diário recente: ${j.join(' | ')}`);
  if (S.aff.cats.includes('biblia')) L.push('- A pessoa gosta de versículos bíblicos: quando fizer sentido, ofereça um versículo ou uma palavra de fé.');
  const recent = (S.chat||[]).filter(m=>!m.err).slice(-4).map(m => `${m.role==='user'?'Pessoa':'Coach'}: ${cut(m.text,120)}`);
  if (recent.length) L.push(`- Final da conversa anterior: ${recent.join(' | ')}`);
  L.push(`- Hoje é ${new Date().toLocaleDateString('pt-BR',{weekday:'long', day:'numeric', month:'long'})}, ${new Date().getHours()}h.`);
  return L.join('\n').slice(0, 2400);
}
function mdLite(t){
  return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/(^|\n)\s*(?:[-•*]|\d+\.)\s+(.+)/g, '$1<li>$2</li>')
    .replace(/(<li>.*<\/li>)/gs, m => `<ul>${m.replace(/\n/g,'')}</ul>`)
    .replace(/\n/g,'<br>');
}

    <div class="card">
      <b>Fissuras nos últimos 14 dias</b>
      <div class="bars">${counts.map((c,i)=>`<div title="${days[i].toLocaleDateString('pt-BR')}: ${c}" style="height:${c/mx*100}%"></div>`).join('')}</div>
      <div class="bars-x"><span>${days[0].toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</span><span>hoje</span></div>
      <p class="tiny" style="margin-top:8px">Com o tempo, as barras tendem a diminuir. Esse é o seu cérebro se recuperando.</p>
    </div>
    <div class="card">
      <b>Seus maiores gatilhos</b>
      ${topT.length ? topT.map(([t,n])=>`<div style="margin-top:10px"><div class="row" style="justify-content:space-between"><span>${esc(t)}</span><span class="muted small">${n}x</span></div><div style="height:6px;background:var(--bg2);border-radius:3px;margin-top:4px"><div style="height:100%;width:${n/topT[0][1]*100}%;background:var(--warn);border-radius:3px"></div></div></div>`).join('') : '<p class="small muted">Registre suas fissuras para descobrir seus padrões.</p>'}
    </div>
    <div class="card">
      <b>Histórico de sequências</b>
      ${rel.length ? [...rel].reverse().map(r=>`<div class="row" style="justify-content:space-between;margin-top:10px"><span class="small">${fmtDate(r.at-r.streakMs)} → ${fmtDate(r.at)}</span><b>${dur(r.streakMs)}</b></div>`).join('') : '<p class="small muted">Nenhuma recaída registrada. Continue assim! 💚</p>'}
    </div>
    ${backupCard()}`;
}
function backupCard(){
  return `<div class="sec-t">Seus dados</div><div class="card">
    <p class="small muted" style="margin-top:0">Tudo fica salvo só neste aparelho, sem conta e sem internet. Faça backup de vez em quando.</p>
    <div class="grid2"><button class="btn" onclick="exportData()">⬇️ Exportar backup</button><button class="btn" onclick="$('#imp').click()">⬆️ Importar</button></div>
    <input type="file" id="imp" accept="application/json" style="display:none" onchange="importData(this)">
    <button class="btn ghost" style="margin-top:8px;color:var(--bad)" onclick="wipe()">Apagar todos os dados</button></div>`;
}
function exportData(){
  const json = JSON.stringify({...S, photos: PH});
  if (NATIVE && NATIVE.share){ NATIVE.share.postMessage({name:`livre-backup-${todayKey()}.json`, content:json}); return; }
  const blob = new Blob([json],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `livre-backup-${todayKey()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function importData(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => { try { const d = JSON.parse(r.result); if(!d.habits) throw 0; if(!confirm('Substituir os dados atuais pelo backup?')) return; const photos = d.photos || {}; delete d.photos; S = {urges:[], journal:[], pledges:{}, ...d}; ensureAff(); for (const id in photos) await phPut(id, photos[id]); save(); syncReminders(); toast('Backup restaurado'); go('home'); } catch(e){ toast('Arquivo inválido'); } };
  r.readAsText(f); inp.value='';
}
function wipe(){ if(!confirm('Apagar TODOS os dados do app? Isso não pode ser desfeito.')) return; Object.keys(PH).forEach(phDel); S={habits:[],urges:[],journal:[],pledges:{},activeId:null}; ensureAff(); save(); syncReminders(); go('home'); }

/* ================== Início ================== */
render();
if (NATIVE && NATIVE.ai) NATIVE.ai.postMessage({type:'status'});
phLoadAll().then(() => { if (tab==='home' || tab==='dreams') render(); });
syncWidget();
if (S.aff.reminders.count) syncReminders();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
