name: Livre
options:
  bundleIdPrefix: com.livreapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Livre:
    type: application
    platform: iOS
    sources:
      - path: Livre
        excludes: ["web/**"]
      - path: Livre/web
        type: folder
        buildPhase: resources
    dependencies:
      - target: LivreWidget
        embed: true
    preBuildScripts:
      - name: Copiar app web
        script: "\"${SRCROOT}/sync-web.sh\""
        basedOnDependencyAnalysis: false
    entitlements:
      path: Livre/Livre.entitlements
      properties:
        com.apple.security.application-groups: [group.com.livreapp.livre]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livreapp.livre
        PRODUCT_NAME: Livre
        INFOPLIST_FILE: Livre/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
  LivreWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LivreWidget
    entitlements:
      path: LivreWidget/LivreWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.livreapp.livre]
    info:
      path: LivreWidget/Info.plist
      properties:
        CFBundleDisplayName: Livre
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livreapp.livre.widget
        PRODUCT_NAME: LivreWidget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
